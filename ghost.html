<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simon "Ghost" Riley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .chat-container { height: calc(100vh - 130px); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden">

    <!-- 頂部導航欄 -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="goBack()" class="text-slate-400 hover:text-white text-sm font-medium flex items-center">
                ❮ 返回 Hub
            </button>
            <h1 class="text-base font-bold text-white flex items-center gap-1.5">
                <span>💀</span> Simon "Ghost" Riley
            </h1>
        </div>
        <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-400">清除紀錄</button>
    </header>

    <!-- 對話內容區 -->
    <main id="chatBox" class="chat-container flex-1 overflow-y-auto p-4 space-y-4">
    </main>

    <!-- 底部輸入欄 -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
        <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center gap-2 max-w-2xl mx-auto">
            <input type="text" id="userInput" placeholder="傳送訊息給 Ghost..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" autocomplete="off">
            <button type="submit" id="sendBtn" class="bg-blue-600 active:bg-blue-700 text-white font-medium px-5 py-3 rounded-xl text-sm transition-colors shrink-0">
                傳送
            </button>
        </form>
    </footer>
