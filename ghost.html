<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simon "Ghost" Riley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 flex flex-col justify-between min-h-screen">

    <!-- 頂部導航欄 -->
    <header class="fixed top-0 left-0 right-0 bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-50">
        <a href="index.html" class="text-blue-400 text-sm font-semibold py-1 px-2">❮ 返回 Hub</a>
        <h1 class="text-sm font-bold text-white">💀 Simon Ghost</h1>
        <button onclick="clearHistory()" class="text-xs text-red-400 py-1 px-2">清除紀錄</button>
    </header>

    <!-- 對話內容區 -->
    <main id="chatBox" class="flex-1 overflow-y-auto px-4 pt-20 pb-24 space-y-3">
        <div class="flex justify-start">
            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200">
                Stealth is key. What's the situation, kid?
            </div>
        </div>
    </main>

    <!-- 底部輸入欄 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-3 z-50">
        <div class="flex items-center gap-2 max-w-2xl mx-auto">
            <input type="text" id="userInput" placeholder="傳送訊息給 Ghost..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" autocomplete="off">
            <button onclick="sendMsgDirect()" id="sendBtn" class="bg-blue-600 active:bg-blue-700 text-white font-medium px-5 py-3 rounded-xl text-sm shrink-0">
                傳送
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = "你是 Simon 'Ghost' Riley，來自 Call of Duty: Modern Warfare 的 Task Force 141 成員。你說話風格冷酷、簡短、專業、略帶英式幽默與軍事口吻。請以繁體中文與用戶對話，維持 Ghost 的酷帥人設。";

        function clearHistory() {
            if (confirm('確定要清除與 Ghost 的所有對話紀錄？')) {
                localStorage.removeItem('ghost_chat_history');
                location.reload();
            }
        }

        function sendMsgDirect() {
            var input = document.getElementById('userInput');
            var chatBox = document.getElementById('chatBox');
            var sendBtn = document.getElementById('sendBtn');
            var text = input.value.trim();
            var apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

            if (!text) {
                alert('請輸入訊息！');
                return;
            }
            if (!apiKey) {
                alert('⚠️ 未偵測到 API Key！請先返回 Hub 設定。');
                window.location.href = 'index.html';
                return;
            }

            // 1. 即時將用戶訊息顯示在畫面上
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-blue-600 text-white">
                        ${text.replace(/</g, "&lt;")}
                    </div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;
            sendBtn.innerText = '...';

            // 2. 透過 CORS Proxy 呼叫 gemini-3.8-flash
            var targetUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + encodeURIComponent(apiKey);
            var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

            fetch(proxyUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [
                        { role: 'user', parts: [{ text: '[System Instructions: ' + SYSTEM_PROMPT + '] ' + text }] }
                    ]
                })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    return { ok: res.ok, data: data };
                });
            })
            .then(function(result) {
                sendBtn.disabled = false;
                sendBtn.innerText = '傳送';

                if (result.ok && result.data.candidates && result.data.candidates[0] && result.data.candidates[0].content && result.data.candidates[0].content.parts && result.data.candidates[0].content.parts[0].text) {
                    var reply = result.data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `
                        <div class="flex justify-start">
                            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200">
                                ${reply.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    `;
                } else {
                    var errReason = result.data.error ? result.data.error.message : JSON.stringify(result.data);
                    chatBox.innerHTML += `
                        <div class="flex justify-start">
                            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-xs bg-red-950 border border-red-800 text-red-200 font-mono">
                                ⚠️ 錯誤: ${errReason}
                            </div>
                        </div>
                    `;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(function(err) {
                sendBtn.disabled = false;
                sendBtn.innerText = '傳送';
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-red-950 border border-red-800 text-red-200">
                            ⚠️ 網絡異常: ${err.message}
                        </div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
