<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simon "Ghost" Riley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        /* 確保上下固定欄不會被 iOS 介面遮擋 */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-slate-950">

    <!-- 頂部導航欄（絕對置頂，保證按鈕點得到） -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-50 safe-top">
        <button onclick="window.location.href='index.html'" class="text-blue-400 hover:text-white text-sm font-semibold py-1 px-2 rounded">
            ❮ 返回 Hub
        </button>
        <h1 class="text-sm font-bold text-white flex items-center gap-1.5">
            <span>💀</span> Simon Ghost
        </h1>
        <button onclick="clearHistory()" class="text-xs text-red-400 hover:text-red-300 py-1 px-2">
            清除紀錄
        </button>
    </header>

    <!-- 對話內容區（自動留空上下距離，避免被遮擋） -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex justify-start">
            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none">
                Stealth is key. What's the situation, kid? (靜悄悄地登場。報告你的狀況。)
            </div>
        </div>
    </main>

    <!-- 底部輸入欄（絕對置底，配合手機安全距離） -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 shrink-0 z-50 safe-bottom">
        <div class="flex items-center gap-2 max-w-2xl mx-auto">
            <input type="text" id="userInput" placeholder="傳送訊息給 Ghost..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500" autocomplete="off">
            <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 active:bg-blue-700 text-white font-medium px-5 py-3 rounded-xl text-sm transition-colors shrink-0">
                傳送
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = "你是 Simon 'Ghost' Riley，來自 Call of Duty: Modern Warfare 的 Task Force 141 成員。你說話風格冷酷、簡短、專業、略帶英式幽默與軍
