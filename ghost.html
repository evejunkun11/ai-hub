<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon "Ghost" Riley</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; }
        .chat-area { height: calc(100vh - 130px); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-slate-950">

    <!-- 頂部導航 -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
        <a href="index.html" class="text-blue-400 text-sm font-semibold">❮ 返回 Hub</a>
        <h1 class="text-sm font-bold text-white">💀 Simon Ghost</h1>
        <button onclick="clearHistory()" class="text-xs text-red-400">清除紀錄</button>
    </header>

    <!-- 對話內容區 -->
    <main id="chatBox" class="chat-area overflow-y-auto p-4 space-y-3 flex-1">
        <div class="flex justify-start">
            <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200">
                Stealth is key. What's the situation, kid?
            </div>
        </div>
    </main>

    <!-- 底部輸入欄 -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
        <div class="flex items-center gap-2 max-w-2xl mx-auto">
            <input type="text" id="userInput" placeholder="傳送訊息給 Ghost..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" autocomplete="off">
            <button onclick="sendMsg()" id="sendBtn" class="bg-blue-600 text-white font-medium px-5 py-3 rounded-xl text-sm shrink-0">
                傳送
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = "你是 Simon 'Ghost' Riley，來自 Call of Duty: Modern Warfare 的 Task Force 141 成員。你說話風格冷酷、簡短、專業、略帶英式幽默與軍事口吻。請以繁體中文與用戶對話，維持 Ghost 的酷帥人設。";

        function clearHistory() {
            if (confirm('確定要清除所有對話紀錄？')) {
                localStorage.removeItem('ghost_chat_history');
                location.reload();
            }
        }

        async function sendMsg() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

            if (!text) return;
            if (!apiKey) {
                alert('⚠️ 請先在 Hub 頁面儲存 API Key！');
                window.location.href = 'index.html';
                return;
            }

            // 1. 立即渲染使用者訊息到畫面上
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'flex justify-end';
            userMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-blue-600 text-white">${text.replace(/</g, "&lt;")}</div>`;
            chatBox.appendChild(userMsgDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;
            sendBtn.innerText = '...';

            try {
                // 直接使用官方路徑，不經 Proxy
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: `[System Instructions: ${SYSTEM_PROMPT}] ${text}` }] }
                        ]
                    })
                });

                const data = await response.json();

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'flex justify-start';

                if (response.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    aiMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200">${reply.replace(/\n/g, '<br>')}</div>`;
                } else {
                    const errText = data.error ? data.error.message : JSON.stringify(data);
                    aiMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-xs bg-red-950 border border-red-800 text-red-200 font-mono">⚠️ 伺服器回傳錯誤: ${errText}</div>`;
                }
                chatBox.appendChild(aiMsgDiv);

            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'flex justify-start';
                errDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-red-950 border border-red-800 text-red-200">⚠️ 連線失敗: ${err.message}</div>`;
                chatBox.appendChild(errDiv);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '傳送';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
