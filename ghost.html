    <script>
        const SYSTEM_PROMPT = "你是 Simon 'Ghost' Riley，來自 Call of Duty: Modern Warfare 的 Task Force 141 成員。你說話風格冷酷、簡短、專業、略帶英式幽默與軍事口吻。請以繁體中文與用戶對話，維持 Ghost 的酷帥人設。";

        function clearHistory() {
            if (confirm('確定要清除所有對話紀錄？')) {
                localStorage.removeItem('ghost_chat_history');
                location.reload();
            }
        }

        async function sendMsg() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();

            if (!text) return;
            if (!apiKey) {
                alert('⚠️ 請先在 Hub 頁面儲存 API Key！');
                window.location.href = 'index.html';
                return;
            }

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'flex justify-end';
            userMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py.5 text-sm bg-blue-600 text-white">${text.replace(/</g, "&lt;")}</div>`;
            chatBox.appendChild(userMsgDiv);
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;
            sendBtn.innerText = '...';

            try {
                // 修正 1：將型號改為正確嘅 gemini-2.0-flash (或 gemini-1.5-flash)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
                
                // 修正 2：使用官方推薦嘅 system_instruction 格式
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: SYSTEM_PROMPT }]
                        },
                        contents: [
                            { role: 'user', parts: [{ text: text }] }
                        ]
                    })
                });

                const data = await response.json();
                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'flex justify-start';

                if (response.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    aiMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-slate-900 border border-slate-800 text-slate-200">${reply.replace(/\n/g, '<br>')}</div>`;
                } else {
                    aiMsgDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-xs bg-red-950 border border-red-800 text-red-200 font-mono">⚠️ 原始回傳數據: ${JSON.stringify(data)}</div>`;
                }
                chatBox.appendChild(aiMsgDiv);

            } catch (err) {
                const errDiv = document.createElement('div');
                errDiv.className = 'flex justify-start';
                errDiv.innerHTML = `<div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm bg-red-950 border border-red-800 text-red-200">⚠️ 捕捉到例外錯誤: ${err.message}</div>`;
                chatBox.appendChild(errDiv);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '傳送';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
