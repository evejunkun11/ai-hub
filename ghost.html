<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon "Ghost" Riley</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between">

    <!-- 頂部 -->
    <header class="bg-slate-900 p-4 border-b border-slate-800 flex justify-between items-center">
        <a href="index.html" class="text-blue-400 text-sm font-medium">❮ 返回 Hub</a>
        <h1 class="font-bold text-sm">💀 Simon Ghost</h1>
        <button onclick="localStorage.removeItem('ghost_chat_history'); location.reload();" class="text-xs text-red-400">清除</button>
    </header>

    <!-- 對話記錄區 -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="bg-slate-900 p-3 rounded-xl max-w-[85%] text-sm">
            Stealth is key. What's the situation, kid?
        </div>
    </main>

    <!-- 輸入區 -->
    <footer class="bg-slate-900 p-3 border-t border-slate-800">
        <div class="flex gap-2">
            <input type="text" id="userInput" placeholder="輸入訊息..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
            <button onclick="sendMsg()" id="sendBtn" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium">傳送</button>
        </div>
    </footer>

    <script>
        async function sendMsg() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');

            if (!text) return;
            if (!apiKey) {
                alert('請先在 Hub 設定 API Key！');
                location.href = 'index.html';
                return;
            }

            // 顯示用戶訊息
            chatBox.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-xl max-w-[85%] ml-auto text-sm">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: text }] }]
                    })
                });

                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="bg-slate-900 p-3 rounded-xl max-w-[85%] text-sm">${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bg-red-900/50 text-red-300 p-3 rounded-xl max-w-[85%] text-sm">API 回傳格式錯誤</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div class="bg-red-900/50 text-red-300 p-3 rounded-xl max-w-[85%] text-sm">連線失敗: ${err.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
