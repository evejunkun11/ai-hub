<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Character AI Mobile App</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f7ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .chat-bubble { word-break: break-word; user-select: text; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- APP CONTAINER -->
  <div id="app" class="flex h-full w-full relative">
    
    <!-- SIDEBAR -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 opacity-0 pointer-events-none transition-opacity duration-300 md:hidden" onclick="toggleSidebar(false)"></div>
    
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-80 bg-slate-950 border-r border-slate-800 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col h-full">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between pt-safe">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg">C</div>
          <span class="font-bold text-lg tracking-wide text-white">Character.AI</span>
        </div>
        <button onclick="openCharacterModal()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition" title="新建角色">
          <i data-lucide="user-plus" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-3 space-y-1" id="character-list"></div>

      <div class="p-3 border-t border-slate-800 space-y-1 pb-safe">
        <button onclick="openBackupModal()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-slate-200 text-sm transition">
          <i data-lucide="database" class="w-4 h-4 text-emerald-400"></i>
          <span>容量與容量備份</span>
        </button>
        <button onclick="openSettingsModal()" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-slate-200 text-sm transition">
          <i data-lucide="settings" class="w-4 h-4 text-blue-400"></i>
          <span>系統及 API 設定</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 relative min-w-0">
      <header class="h-16 border-b border-slate-800/80 bg-slate-900/90 backdrop-blur flex items-center justify-between px-4 z-10 pt-safe">
        <div class="flex items-center space-x-3 min-w-0">
          <button onclick="toggleSidebar(true)" class="md:hidden p-2 -ml-2 text-slate-400 hover:text-white">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          
          <div class="relative cursor-pointer flex items-center space-x-3 min-w-0" onclick="openCharacterModal(true)">
            <div id="active-avatar" class="w-10 h-10 rounded-full bg-slate-700 flex-shrink-0 flex items-center justify-center overflow-hidden border border-slate-700 text-xl shadow"></div>
            <div class="min-w-0">
              <h2 id="active-name" class="font-semibold text-white truncate text-base leading-tight">未選擇角色</h2>
              <p id="active-status" class="text-xs text-slate-400 truncate">點擊檢視角色資料及設定</p>
            </div>
          </div>
        </div>

        <div class="flex items-center space-x-1">
          <button onclick="openMemoryModal()" class="p-2 text-slate-400 hover:text-amber-400 rounded-lg hover:bg-slate-800 transition" title="記憶與背景檔案">
            <i data-lucide="brain" class="w-5 h-5"></i>
          </button>
          <button onclick="clearCurrentChat()" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition" title="重置對話">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          </button>
        </div>
      </header>

      <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full"></div>

      <div id="typing-indicator" class="hidden px-6 py-2 text-xs text-slate-400 flex items-center space-x-2 animate-pulse max-w-4xl mx-auto w-full">
        <span id="typing-name">AI</span> 正在思考中<span class="animate-bounce">.</span><span class="animate-bounce delay-100">.</span><span class="animate-bounce delay-200">.</span>
      </div>

      <div class="p-3 md:p-4 border-t border-slate-800/80 bg-slate-900/95 backdrop-blur pb-safe">
        <div class="max-w-4xl mx-auto flex items-end space-x-2 bg-slate-800/80 rounded-2xl p-1.5 border border-slate-700/60 focus-within:border-blue-500/80 transition">
          <textarea id="user-input" rows="1" placeholder="輸入訊息..." 
            class="flex-1 bg-transparent px-3 py-2 text-slate-100 placeholder-slate-400 focus:outline-none resize-none max-h-32 text-sm md:text-base"
            oninput="autoResizeTextarea(this)" onkeydown="handleKeyDown(event)"></textarea>
          
          <button id="send-btn" onclick="sendMessage()" 
            class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center flex-shrink-0 disabled:opacity-40 disabled:cursor-not-allowed transition shadow-md">
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // System Initialization & Storage Code here...
  </script>
</body>
</html>
