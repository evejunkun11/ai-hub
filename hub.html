<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My AI Apps Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
    
    .nav-bar {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .nav-bar::-webkit-scrollbar { display: none; }
    
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #6366f1;
      color: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    
    .content-area { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #0f172a; }
  </style>
</head>
<body>

  <!-- Top Navigation Tabs -->
  <div class="nav-bar">
    <button class="tab-btn active" onclick="switchApp('ghost.html', this)">💀 Ghost AI</button>
    <button class="tab-btn" onclick="switchApp('character_ai.html', this)">💬 Character AI</button>
    <button class="tab-btn" onclick="switchApp('assistant.html', this)">🤖 Custom Assistant</button>
  </div>

  <!-- Main Iframe App Display Area -->
  <div class="content-area">
    <iframe id="app-runner" src="ghost.html"></iframe>
  </div>

  <script>
    function switchApp(fileUrl, btn) {
      document.getElementById('app-runner').src = fileUrl;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
