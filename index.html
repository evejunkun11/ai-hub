<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI App Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto">

    <div>
        <!-- 標題 -->
        <header class="py-6 text-center border-b border-slate-800">
            <h1 class="text-2xl font-bold text-white tracking-wide">🤖 My AI Apps Hub</h1>
            <p class="text-xs text-slate-400 mt-1">選擇你要使用的 AI 角色 App</p>
        </header>

        <!-- API Key 設定區塊 -->
        <section class="mt-6 bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-semibold text-slate-200">🔑 Gemini API Key</label>
                <span id="keyStatus" class="text-xs px-2 py-0.5 rounded bg-red-500/20 text-red-400 font-medium">未儲存</span>
            </div>
            <input type="password" id="apiKeyInput" placeholder="請貼上 AI Studio 取得的 Key..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 mb-3">
            <button onclick="saveApiKey()" class="w-full bg-blue-600 active:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition-colors shadow">
                儲存 API Key
            </button>
        </section>

        <!-- App 清單 -->
        <section class="mt-6 space-y-3">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">可用應用程式</h2>
            
            <button onclick="launchApp('ghost.html')" class="w-full bg-slate-800 hover:bg-slate-750 active:bg-slate-700 border border-slate-700 p-4 rounded-2xl flex items-center justify-between text-left transition-all shadow-md group">
                <div class="flex items-center space-x-3">
                    <div class="text-2xl">💀</div>
                    <div>
                        <div class="font-bold text-white group-hover:text-blue-400 transition-colors">Simon "Ghost" Riley</div>
                        <div class="text-xs text-slate-400">COD 角色專屬 AI 對話</div>
                    </div>
                </div>
                <div class="text-slate-500 text-sm">開啟 ➔</div>
            </button>

            <button onclick="launchApp('character_ai.html')" class="w-full bg-slate-800 hover:bg-slate-750 active:bg-slate-700 border border-slate-700 p-4 rounded-2xl flex items-center justify-between text-left transition-all shadow-md group">
                <div class="flex items-center space-x-3">
                    <div class="text-2xl">💬</div>
                    <div>
                        <div class="font-bold text-white group-hover:text-blue-400 transition-colors">Character AI</div>
                        <div class="text-xs text-slate-400">自訂角色與歷史紀錄</div>
                    </div>
                </div>
                <div class="text-slate-500 text-sm">開啟 ➔</div>
            </button>
        </section>
    </div>

    <!-- 底部資訊 -->
    <footer class="py-4 text-center text-xs text-slate-500">
        GitHub Pages 獨立執行版
    </footer>

    <script>
        // 初始化檢查 API Key
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                updateStatus(true);
            }
        };

        function updateStatus(isSaved) {
            const statusEl = document.getElementById('keyStatus');
            if (isSaved) {
                statusEl.textContent = '已就緒';
                statusEl.className = 'text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-medium';
            } else {
                statusEl.textContent = '未儲存';
                statusEl.className = 'text-xs px-2 py-0.5 rounded bg-red-500/20 text-red-400 font-medium';
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('請先輸入有效的 API Key');
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            updateStatus(true);
            alert('✅ API Key 已成功儲存！現在可以開啟 App 對話。');
        }

        function launchApp(url) {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (!savedKey) {
                alert('⚠️ 請先在上方輸入並儲存 Gemini API Key，才可開啟 App！');
                return;
            }
            // 直接跳轉，徹底避開 iOS Iframe 權限限制
            window.location.href = url;
        }
    </script>
</body>
</html>
